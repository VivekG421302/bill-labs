<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d11" />
    <script>
      // Shared with the Petrol bill page: one theme for the whole site, dark by default.
      try { document.documentElement.dataset.theme = localStorage.getItem('billlabs.theme') === 'light' ? 'light' : 'dark' } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
    <title>Bill Labs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
